<a class="saltar" href="#contenido" (click)="saltarAlContenido($event)">Saltar al contenido</a>

<header class="cabecera">
  <div class="contenedor barra">
    <a class="marca" routerLink="/recursos">Reservas</a>

    <nav class="navegacion" aria-label="Principal">
      <a routerLink="/recursos" routerLinkActive="activo" ariaCurrentWhenActive="page">Recursos</a>
    </nav>

    @let usuarios = usuariosService.usuarios;
    @if (usuarios.hasValue()) {
      <app-selector-usuario
        [usuarios]="usuarios.value()"
        [actualId]="usuariosService.actualId()"
        (cambiar)="usuariosService.seleccionar($event)"
      />
    } @else if (usuarios.error()) {
      <span class="aviso-usuarios" role="alert">Usuarios no disponibles</span>
    }
  </div>
</header>

<main id="contenido" class="contenedor" tabindex="-1">
  <router-outlet />
</main>
